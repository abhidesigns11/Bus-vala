<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>बस वाला | Bus Vala</title>
  
  <!-- Rozha One Font from hornokplease.xyz -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rozha+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      width: 100vw;
      background-color: #05020a;
      color: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Dynamic Background Container */
    #bg-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 0.8s ease-in-out;
      z-index: 1;
    }

    /* Top Status Bar */
    .top-bar {
      width: 100%;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      z-index: 10;
    }

    .status-pill {
      background: rgba(255, 255, 255, 0.12);
      padding: 5px 12px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .green-dot {
      width: 7px;
      height: 7px;
      background-color: #2ed573;
      border-radius: 50%;
      box-shadow: 0 0 6px #2ed573;
    }

    /* Main Center Title */
    .content {
      text-align: center;
      margin-top: 30px;
      z-index: 10;
    }

    .main-title {
      font-family: 'Rozha One', serif;
      font-size: 4.8rem;
      font-weight: 400;
      letter-spacing: 1px;
      text-shadow: 0px 4px 30px rgba(0, 0, 0, 0.7);
    }

    /* Floating Side Horn Button */
    .horn-btn {
      position: absolute;
      left: 20px;
      top: 52%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: white;
      padding: 8px 16px;
      border-radius: 25px;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      z-index: 10;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .horn-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-50%) scale(1.05);
    }

    /* Auto-Changing Hindi Shayari Container */
    .shayari-container {
      position: absolute;
      bottom: 120px;
      width: 90%;
      max-width: 600px;
      text-align: center;
      z-index: 10;
    }

    .shayari-text {
      font-size: 1.25rem;
      font-weight: 500;
      line-height: 1.5;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      opacity: 1;
      transition: opacity 0.8s ease-in-out;
    }

    .shayari-text.fade-out {
      opacity: 0;
    }

    /* Bottom Control Bar Container */
    .player-container {
      position: absolute;
      bottom: 25px;
      width: 92%;
      max-width: 620px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* Match Reference Pill Glassmorphism UI */
    .glass-player {
      width: 100%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 60px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    .track-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .album-art {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .track-details {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 100%;
    }

    .song-title {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .artist-name {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
    }

    /* Progress Bar */
    .progress-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 2px;
    }

    .progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      width: 30%;
      height: 100%;
      background: #ffffff;
      border-radius: 2px;
    }

    .time-stamp {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
    }

    /* Control Buttons */
    .player-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.85);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }

    .ctrl-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }

    .ctrl-btn.play-circle {
      background: #ffffff;
      color: #000000;
      width: 38px;
      height: 38px;
      font-size: 15px;
    }

    .ctrl-btn.play-circle:hover {
      transform: scale(1.05);
      background: #ffffff;
    }

    /* Spotify Frame Hidden for Streaming Engine */
    #spotify-player {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Dynamic Background Container -->
  <div id="bg-container"></div>

  <!-- Top Status Bar -->
  <header class="top-bar">
    <span id="clock">04:10 PM</span>
    <div class="status-pill">
      <span class="green-dot"></span> <span id="passenger-count">1</span> on the highway
    </div>
  </header>

  <!-- Title in Rozha One Font -->
  <main class="content">
    <h1 class="main-title">बस वाला</h1>
  </main>

  <!-- Horn Button linked to horn.mp3 -->
  <button class="horn-btn" onclick="playHorn()">
    <i class="fa-solid fa-volume-high"></i>
    <span>हॉर्न ओके प्लीज</span>
  </button>

  <!-- Auto-Changing Hindi Shayari Text -->
  <div class="shayari-container">
    <p class="shayari-text" id="shayari-box">नीम का पेड़ चंदन से कम नहीं, हमारा गुड़गाँव लंदन से कम नहीं।</p>
  </div>

  <!-- Glassmorphism Music Player Bar -->
  <div class="player-container">
    <div class="glass-player">
      <div class="track-left">
        <img class="album-art" src="bus1.jpg" id="album-thumb" alt="Album Cover" />
        <div class="track-details">
          <span class="song-title" id="song-title">सफ़र का मज़ा</span>
          <span class="artist-name" id="artist-name">Kumar Sanu & Alka Yagnik</span>
          <div class="progress-box">
            <div class="progress-bar">
              <div class="progress-fill"></div>
            </div>
            <span class="time-stamp">0:45 / 4:22</span>
          </div>
        </div>
      </div>

      <div class="player-controls">
        <button class="ctrl-btn" onclick="prevTrack()" title="Switch BG"><i class="fa-solid fa-shuffle"></i></button>
        <button class="ctrl-btn" onclick="prevTrack()"><i class="fa-solid fa-backward-step"></i></button>
        <button class="ctrl-btn play-circle" onclick="togglePlay()"><i class="fa-solid fa-play" id="play-icon"></i></button>
        <button class="ctrl-btn" onclick="nextTrack()"><i class="fa-solid fa-forward-step"></i></button>
        <button class="ctrl-btn" onclick="nextTrack()" title="Switch BG"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </div>

  <!-- Connected Spotify Engine -->
  <iframe 
    id="spotify-player"
    src="https://open.spotify.com/embed/playlist/68SlxR9n2Ij1fTcNoQqF3f?utm_source=generator&theme=0" 
    width="100%" 
    height="152" 
    frameBorder="0" 
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
    loading="lazy">
  </iframe>

  <script>
    // Bus Background Images Array
    const bgImages = [
      { name: "Bus View 1", url: "bus1.jpg" },
      { name: "Bus View 2", url: "bus2.jpg" }
    ];

    // Auto Rotating Hindi Shayari List
    const shayaris = [
      "नीम का पेड़ चंदन से कम नहीं, हमारा गुड़गाँव लंदन से कम नहीं।",
      "सफ़र खूबसूरत है मंज़िल से भी... खिड़की वाली सीट मसीहा!",
      "हँस मत पगली, प्यार हो जाएगा... हॉर्न ओके प्लीज!",
      "सफ़र लंबा है दोस्त बनाते रहिए, दिल मिले न मिले हाथ मिलाते रहिए।"
    ];

    let currentBgIndex = 0;
    let currentShayariIndex = 0;
    let isPlaying = false;
    let hornAudio = null;

    // Set initial background image
    document.getElementById('bg-container').style.backgroundImage = `url('${bgImages[0].url}')`;

    // Toggle Play/Pause Button State
    function togglePlay() {
      const playIcon = document.getElementById('play-icon');
      isPlaying = !isPlaying;

      if (isPlaying) {
        playIcon.className = 'fa-solid fa-pause';
      } else {
        playIcon.className = 'fa-solid fa-play';
      }
    }

    function nextTrack() {
      currentBgIndex = (currentBgIndex + 1) % bgImages.length;
      updateBackground();
    }

    function prevTrack() {
      currentBgIndex = (currentBgIndex - 1 + bgImages.length) % bgImages.length;
      updateBackground();
    }

    function updateBackground() {
      document.getElementById('bg-container').style.backgroundImage = `url('${bgImages[currentBgIndex].url}')`;
      document.getElementById('album-thumb').src = bgImages[currentBgIndex].url;
    }

    // Safe Horn Playback
    function playHorn() {
      if (!hornAudio) {
        hornAudio = new Audio('horn.mp3');
      }
      hornAudio.currentTime = 0;

      const playPromise = hornAudio.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          console.warn("Audio playback failed or was blocked by browser:", error);
        });
      }
    }

    // Shayari Rotation Loop (Changes every 6 seconds)
    setInterval(() => {
      const shayariBox = document.getElementById('shayari-box');
      shayariBox.classList.add('fade-out');

      setTimeout(() => {
        currentShayariIndex = (currentShayariIndex + 1) % shayaris.length;
        shayariBox.innerText = shayaris[currentShayariIndex];
        shayariBox.classList.remove('fade-out');
      }, 800);
    }, 6000);

    // Live Clock Update
    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);
  </script>
</body>
</html>
