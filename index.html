<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>बस वाला | Bus Vala</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rozha+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #05020a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .app-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px 16px 24px 16px;
    }

    /* Background Image Layer */
    #bg-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      transition: background-image 0.8s ease-in-out;
      z-index: 1;
    }

    /* Top Status Bar */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      z-index: 10;
    }

    .status-pill {
      background: rgba(255, 255, 255, 0.15);
      padding: 5px 14px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .green-dot {
      width: 7px;
      height: 7px;
      background-color: #2ed573;
      border-radius: 50%;
      box-shadow: 0 0 6px #2ed573;
    }

    /* Title Positioned Upward (Centered) */
    .center-top-branding {
      position: absolute;
      top: 26%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      width: 100%;
      pointer-events: none;
    }

    .main-title {
      font-family: 'Rozha One', serif;
      font-size: clamp(2.8rem, 10vw, 4.5rem);
      font-weight: 400;
      color: #ffffff;
      text-shadow: 0px 4px 30px rgba(0, 0, 0, 0.85);
    }

    /* Floating Horn Button */
    .horn-btn {
      position: absolute;
      left: 16px;
      top: 54%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: white;
      padding: 8px 16px;
      border-radius: 25px;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      z-index: 10;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    /* Bottom Section Container */
    .bottom-section {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
      position: relative;
    }

    /* Playlist Drawer Overlay */
    .playlist-drawer {
      width: 100%;
      max-height: 260px;
      background: rgba(20, 10, 10, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 24px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.3s ease;
      position: absolute;
      bottom: 105%;
    }

    .playlist-drawer.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .playlist-item {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      gap: 12px;
    }

    .playlist-item.active-track {
      background: rgba(255, 255, 255, 0.2);
      font-weight: 600;
    }

    .track-num {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      min-width: 16px;
    }

    .track-info-mini {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .track-title-mini {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }

    .track-artist-mini {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
    }

    /* Shayari Text */
    .shayari-container {
      width: 100%;
      text-align: center;
      padding: 0 8px;
    }

    .shayari-text {
      font-size: clamp(0.9rem, 3.5vw, 1.05rem);
      font-weight: 500;
      line-height: 1.35;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      opacity: 1;
      transition: opacity 0.8s ease-in-out;
    }

    .shayari-text.fade-out {
      opacity: 0;
    }

    /* Exact Mobile Glass Player Box Match */
    .glass-player {
      width: 100%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 36px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    .track-top-row {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    .album-art {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.3);
      flex-shrink: 0;
    }

    .track-details {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      overflow: hidden;
    }

    .song-title {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist-name {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 4px;
    }

    .progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #ffffff;
      border-radius: 2px;
      transition: width 0.3s linear;
    }

    .time-stamp {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
    }

    /* Player Controls Centered Row */
    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      width: 100%;
      margin-top: 2px;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    .ctrl-btn.play-circle {
      background: #ffffff;
      color: #000000;
      width: 44px;
      height: 44px;
      font-size: 16px;
    }

    /* Hidden YouTube Container */
    #yt-player-container {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Dynamic Background Layer -->
  <div id="bg-container"></div>

  <div class="app-viewport">
    <!-- Top Status Bar -->
    <header class="top-bar">
      <span id="clock">17:40</span>
      <div class="status-pill">
        <span class="green-dot"></span> <span id="passenger-count">1</span> on the highway
      </div>
    </header>

    <!-- Main Title -->
    <main class="center-top-branding">
      <h1 class="main-title">बस वाला</h1>
    </main>

    <!-- Floating Horn Button -->
    <button class="horn-btn" onclick="playHorn()">
      <i class="fa-solid fa-volume-high"></i>
      <span>हॉर्न ओके प्लीज</span>
    </button>

    <!-- Bottom Section Container -->
    <div class="bottom-section">

      <!-- Playlist Overlay Drawer -->
      <div class="playlist-drawer" id="playlist-drawer"></div>

      <!-- Auto-Changing Shayari Text -->
      <div class="shayari-container">
        <p class="shayari-text" id="shayari-box">बुरी नजर वाले, तेरे बच्चे जियें; बड़े होकर, तेरा ही खून पियें!</p>
      </div>

      <!-- Native Mobile Stacked Glass Player Box -->
      <div class="glass-player">
        <div class="track-top-row">
          <img class="album-art" src="bus1.jpg" id="album-thumb" alt="Album Cover" />
          <div class="track-details">
            <span class="song-title" id="song-title">Tumhein Dekhen Meri Aankhen</span>
            <span class="artist-name" id="artist-name">Alka Yagnik & Kumar Sanu</span>
            <div class="progress-box">
              <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
              </div>
              <span class="time-stamp" id="time-stamp">0:00 / 0:00</span>
            </div>
          </div>
        </div>

        <div class="player-controls">
          <button class="ctrl-btn" onclick="toggleShuffle()" title="Shuffle"><i class="fa-solid fa-shuffle"></i></button>
          <button class="ctrl-btn" onclick="prevTrack()"><i class="fa-solid fa-backward-step"></i></button>
          <button class="ctrl-btn play-circle" onclick="togglePlay()"><i class="fa-solid fa-play" id="play-icon"></i></button>
          <button class="ctrl-btn" onclick="nextTrack()"><i class="fa-solid fa-forward-step"></i></button>
          <button class="ctrl-btn" onclick="togglePlaylistDrawer()" title="View Playlist"><i class="fa-solid fa-list-ul"></i></button>
        </div>
      </div>
    </div>
  </div>

  <div id="yt-player-container">
    <div id="yt-player"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const bgImages = ["bus1.jpg", "bus2.jpg"];
    const shayaris = [
      "बुरी नजर वाले, तेरे बच्चे जियें; बड़े होकर, तेरा ही खून पियें!",
      "नीम का पेड़ चंदन से कम नहीं, हमारा गुड़गाँव लंदन से कम नहीं।",
      "सफ़र खूबसूरत है मंज़िल से भी... खिड़की वाली सीट मसीहा!",
      "हँस मत पगली वरना प्यार हो जाएगा तो प्यार हुआ क्या?"
    ];

    let currentBgIndex = 0;
    let currentShayariIndex = 0;
    let player = null;
    let isPlaying = false;
    let hornAudio = null;

    document.getElementById('bg-container').style.backgroundImage = `url('${bgImages[0]}')`;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        height: '100',
        width: '100',
        playerVars: {
          listType: 'playlist',
          list: 'PL0umg_TNpoZTTdZVIi5tfX69pRmoMFGna',
          autoplay: 0,
          controls: 0
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      updateTrackInfo();
      setInterval(updateProgress, 1000);
      populatePlaylistDrawer();
    }

    function onPlayerStateChange(event) {
      const playIcon = document.getElementById('play-icon');
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playIcon.className = 'fa-solid fa-pause';
        onTrackChanged();
      } else {
        isPlaying = false;
        playIcon.className = 'fa-solid fa-play';
      }
    }

    function onTrackChanged() {
      updateTrackInfo();
      rotateBackgroundImage();
      highlightActivePlaylistItem();
    }

    function rotateBackgroundImage() {
      currentBgIndex = (currentBgIndex + 1) % bgImages.length;
      document.getElementById('bg-container').style.backgroundImage = `url('${bgImages[currentBgIndex]}')`;
    }

    function togglePlay() {
      if (!player) return;
      isPlaying ? player.pauseVideo() : player.playVideo();
    }

    function nextTrack() { if (player) player.nextVideo(); }
    function prevTrack() { if (player) player.previousVideo(); }

    function toggleShuffle() {
      if (player) {
        player.setShuffle(true);
        nextTrack();
      }
    }

    function togglePlaylistDrawer() {
      const drawer = document.getElementById('playlist-drawer');
      drawer.classList.toggle('active');
      if (drawer.classList.contains('active')) populatePlaylistDrawer();
    }

    function playTrackIndex(index) {
      if (player && player.playVideoAt) player.playVideoAt(index);
    }

    function populatePlaylistDrawer() {
      if (!player || !player.getPlaylist) return;
      const playlist = player.getPlaylist();
      const drawer = document.getElementById('playlist-drawer');
      if (!playlist || playlist.length === 0) return;

      const currentTrackIndex = player.getPlaylistIndex ? player.getPlaylistIndex() : 0;
      drawer.innerHTML = '';

      playlist.forEach((id, idx) => {
        const item = document.createElement('div');
        item.className = `playlist-item ${idx === currentTrackIndex ? 'active-track' : ''}`;
        item.onclick = () => playTrackIndex(idx);
        item.innerHTML = `
          <span class="track-num">${idx + 1}</span>
          <div class="track-info-mini">
            <span class="track-title-mini" id="pl-title-${idx}">Track ${idx + 1}</span>
            <span class="track-artist-mini">YT Music</span>
          </div>
        `;
        drawer.appendChild(item);
      });
      highlightActivePlaylistItem();
    }

    function highlightActivePlaylistItem() {
      if (!player || !player.getPlaylistIndex) return;
      const idx = player.getPlaylistIndex();
      document.querySelectorAll('.playlist-item').forEach((item, i) => {
        item.classList.toggle('active-track', i === idx);
      });
    }

    function updateTrackInfo() {
      if (!player || !player.getVideoData) return;
      const data = player.getVideoData();
      if (data && data.title) {
        document.getElementById('song-title').innerText = data.title;
        document.getElementById('artist-name').innerText = data.author || "YouTube Music";

        if (data.video_id) {
          document.getElementById('album-thumb').src = `https://img.youtube.com/vi/${data.video_id}/hqdefault.jpg`;
        }

        const activeIndex = player.getPlaylistIndex ? player.getPlaylistIndex() : 0;
        const miniTitle = document.getElementById(`pl-title-${activeIndex}`);
        if (miniTitle) miniTitle.innerText = data.title;
      }
    }

    function updateProgress() {
      if (!player || !player.getCurrentTime || !isPlaying) return;
      const currentTime = player.getCurrentTime() || 0;
      const duration = player.getDuration() || 1;
      document.getElementById('progress-fill').style.width = `${(currentTime / duration) * 100}%`;

      const formatTime = (sec) => {
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      document.getElementById('time-stamp').innerText = `${formatTime(currentTime)} / ${formatTime(duration)}`;
    }

    function playHorn() {
      if (!hornAudio) hornAudio = new Audio('horn.mp3');
      hornAudio.currentTime = 0;
      hornAudio.play().catch(err => console.warn("Audio blocked:", err));
    }

    setInterval(() => {
      const shayariBox = document.getElementById('shayari-box');
      shayariBox.classList.add('fade-out');
      setTimeout(() => {
        currentShayariIndex = (currentShayariIndex + 1) % shayaris.length;
        shayariBox.innerText = shayaris[currentShayariIndex];
        shayariBox.classList.remove('fade-out');
      }, 800);
    }, 6000);

    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    }, 1000);
  </script>
</body>
</html>
