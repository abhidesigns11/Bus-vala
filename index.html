<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>बस वाला | Bus Vala</title>
  
  <!-- Rozha One Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rozha+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #05020a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Main Viewport */
    .app-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 20px 20px;
    }

    /* Dynamic Background Layer */
    #bg-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 0.8s ease-in-out;
      z-index: 1;
    }

    /* Top Status Bar */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      z-index: 10;
    }

    .status-pill {
      background: rgba(255, 255, 255, 0.15);
      padding: 5px 14px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .green-dot {
      width: 7px;
      height: 7px;
      background-color: #2ed573;
      border-radius: 50%;
      box-shadow: 0 0 6px #2ed573;
    }

    /* Title Positioned Upward (Horizontal Center, Vertical 24%) */
    .center-top-branding {
      position: absolute;
      top: 24%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      width: 100%;
      pointer-events: none;
    }

    .main-title {
      font-family: 'Rozha One', serif;
      font-size: clamp(3rem, 8.5vw, 5.2rem);
      font-weight: 400;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0px 4px 35px rgba(0, 0, 0, 0.85);
    }

    /* Floating Side Horn Button */
    .horn-btn {
      position: absolute;
      left: 20px;
      top: 52%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: white;
      padding: 8px 16px;
      border-radius: 25px;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      z-index: 10;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .horn-btn:hover {
      background: rgba(255, 255, 255, 0.28);
      transform: translateY(-50%) scale(1.05);
    }

    /* Bottom Section */
    .bottom-section {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
      margin-bottom: 5px;
    }

    /* Auto-Changing Shayari Container */
    .shayari-container {
      width: 100%;
      text-align: center;
      padding: 0 10px;
    }

    .shayari-text {
      font-size: clamp(0.95rem, 3.2vw, 1.15rem);
      font-weight: 500;
      line-height: 1.4;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      opacity: 1;
      transition: opacity 0.8s ease-in-out;
    }

    .shayari-text.fade-out {
      opacity: 0;
    }

    /* Frosted Glass UI Player */
    .glass-player {
      width: 100%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 60px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    .track-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .album-art {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .track-details {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 100%;
    }

    .song-title {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .artist-name {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
    }

    .progress-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 2px;
    }

    .progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #ffffff;
      border-radius: 2px;
      transition: width 0.3s linear;
    }

    .time-stamp {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.85);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }

    .ctrl-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }

    .ctrl-btn.play-circle {
      background: #ffffff;
      color: #000000;
      width: 38px;
      height: 38px;
      font-size: 15px;
    }

    /* Hidden YouTube Player Wrapper */
    #yt-player-container {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Background Layer -->
  <div id="bg-container"></div>

  <div class="app-viewport">
    <!-- Top Status Bar -->
    <header class="top-bar">
      <span id="clock">05:21 PM</span>
      <div class="status-pill">
        <span class="green-dot"></span> <span id="passenger-count">1</span> on the highway
      </div>
    </header>

    <!-- Main Title -->
    <main class="center-top-branding">
      <h1 class="main-title">बस वाला</h1>
    </main>

    <!-- Floating Horn Button -->
    <button class="horn-btn" onclick="playHorn()">
      <i class="fa-solid fa-volume-high"></i>
      <span>हॉर्न ओके प्लीज</span>
    </button>

    <!-- Bottom Section -->
    <div class="bottom-section">
      <!-- Auto-Changing Hindi Shayari Text -->
      <div class="shayari-container">
        <p class="shayari-text" id="shayari-box">नीम का पेड़ चंदन से कम नहीं, हमारा गुड़गाँव लंदन से कम नहीं।</p>
      </div>

      <!-- Glassmorphism Player -->
      <div class="glass-player">
        <div class="track-left">
          <img class="album-art" src="bus1.jpg" id="album-thumb" alt="Album Cover" />
          <div class="track-details">
            <span class="song-title" id="song-title">Loading Playlist...</span>
            <span class="artist-name" id="artist-name">YouTube Music</span>
            <div class="progress-box">
              <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
              </div>
              <span class="time-stamp" id="time-stamp">0:00 / 0:00</span>
            </div>
          </div>
        </div>

        <div class="player-controls">
          <button class="ctrl-btn" onclick="toggleShuffle()" title="Shuffle"><i class="fa-solid fa-shuffle"></i></button>
          <button class="ctrl-btn" onclick="prevTrack()"><i class="fa-solid fa-backward-step"></i></button>
          <button class="ctrl-btn play-circle" onclick="togglePlay()"><i class="fa-solid fa-play" id="play-icon"></i></button>
          <button class="ctrl-btn" onclick="nextTrack()"><i class="fa-solid fa-forward-step"></i></button>
          <button class="ctrl-btn" onclick="switchBackground()" title="Switch Background"><i class="fa-solid fa-bars"></i></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden YT Player Engine -->
  <div id="yt-player-container">
    <div id="yt-player"></div>
  </div>

  <!-- YouTube Iframe API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    // Bus Background Images Array
    const bgImages = [
      { name: "Bus View 1", url: "bus1.jpg" },
      { name: "Bus View 2", url: "bus2.jpg" }
    ];

    // Auto Rotating Hindi Shayari List
    const shayaris = [
      "नीम का पेड़ चंदन से कम नहीं, हमारा गुड़गाँव लंदन से कम नहीं।",
      "सफ़र खूबसूरत है मंज़िल से भी... खिड़की वाली सीट मसीहा!",
      "हँस मत पगली वरना प्यार हो जाएगा तो प्यार हुआ क्या?",
      "सफ़र लंबा है दोस्त बनाते रहिए, दिल मिले न मिले हाथ मिलाते रहिए।"
    ];

    let currentBgIndex = 0;
    let currentShayariIndex = 0;
    let player = null;
    let isPlaying = false;
    let hornAudio = null;

    // Set initial background image
    document.getElementById('bg-container').style.backgroundImage = `url('${bgImages[0].url}')`;

    // Initialize YouTube Player with your YT Music Playlist
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        height: '100',
        width: '100',
        playerVars: {
          listType: 'playlist',
          list: 'PLeatb7hupNV_AWUl_7ttbsKeCQh8tF5N4', // Your Playlist ID
          autoplay: 0,
          controls: 0
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      updateTrackInfo();
      setInterval(updateProgress, 1000);
    }

    function onPlayerStateChange(event) {
      const playIcon = document.getElementById('play-icon');
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playIcon.className = 'fa-solid fa-pause';
        updateTrackInfo();
      } else {
        isPlaying = false;
        playIcon.className = 'fa-solid fa-play';
      }
    }

    function togglePlay() {
      if (!player) return;
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    function nextTrack() {
      if (player) {
        player.nextVideo();
        setTimeout(updateTrackInfo, 1000);
      }
    }

    function prevTrack() {
      if (player) {
        player.previousVideo();
        setTimeout(updateTrackInfo, 1000);
      }
    }

    function toggleShuffle() {
      if (player) {
        player.setShuffle(true);
        nextTrack();
      }
    }

    function switchBackground() {
      currentBgIndex = (currentBgIndex + 1) % bgImages.length;
      document.getElementById('bg-container').style.backgroundImage = `url('${bgImages[currentBgIndex].url}')`;
    }

    function updateTrackInfo() {
      if (!player || !player.getVideoData) return;
      const data = player.getVideoData();
      if (data && data.title) {
        document.getElementById('song-title').innerText = data.title;
        document.getElementById('artist-name').innerText = data.author || "YouTube Music";
        
        // Use video thumbnail if available
        if (data.video_id) {
          document.getElementById('album-thumb').src = `https://img.youtube.com/vi/${data.video_id}/hqdefault.jpg`;
        }
      }
    }

    function updateProgress() {
      if (!player || !player.getCurrentTime || !isPlaying) return;
      const currentTime = player.getCurrentTime() || 0;
      const duration = player.getDuration() || 1;

      const percent = (currentTime / duration) * 100;
      document.getElementById('progress-fill').style.width = `${percent}%`;

      const formatTime = (sec) => {
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      document.getElementById('time-stamp').innerText = `${formatTime(currentTime)} / ${formatTime(duration)}`;
    }

    // Horn Playback
    function playHorn() {
      if (!hornAudio) {
        hornAudio = new Audio('horn.mp3');
      }
      hornAudio.currentTime = 0;

      const playPromise = hornAudio.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          console.warn("Audio playback failed or was blocked by browser:", error);
        });
      }
    }

    // Shayari Rotation Loop (6 Seconds)
    setInterval(() => {
      const shayariBox = document.getElementById('shayari-box');
      shayariBox.classList.add('fade-out');

      setTimeout(() => {
        currentShayariIndex = (currentShayariIndex + 1) % shayaris.length;
        shayariBox.innerText = shayaris[currentShayariIndex];
        shayariBox.classList.remove('fade-out');
      }, 800);
    }, 6000);

    // Live Clock Update
    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);
  </script>
</body>
</html>
